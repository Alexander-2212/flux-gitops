apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kbot
  namespace: flux-system
spec:
  interval: 1m
  releaseName: kbot
  targetNamespace: kbot
  storageNamespace: kbot
  chart:
    spec:
      chart: ./helm
      sourceRef:
        kind: GitRepository
        name: kbot
      # CI changes only image.tag in values.yaml; Chart.yaml version stays the
      # same. The default ChartVersion strategy would ignore such commits, so
      # rebuild the chart on every new Git revision instead.
      reconcileStrategy: Revision
      interval: 1m
  install:
    timeout: 3m
    remediation:
      retries: -1
  upgrade:
    timeout: 3m
    remediation:
      retries: 3
      remediateLastFailure: true
  # The TELE_TOKEN secret is created out of band, never committed:
  #   kubectl -n kbot create secret generic kbot-token --from-literal=token=...
  values:
    tele:
      existingSecret: kbot-token
